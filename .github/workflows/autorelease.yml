name: Autorelease

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  autorelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: Codegen
        run: mise run codegen

      - name: Create PR if differences exist
        id: create_pr
        run: |
          if [[ -n $(git status -s) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            branch_name="chore/codegen-update-$(date +%s)"
            git checkout -b "$branch_name"
            git add .
            git commit -m "chore: update generated files"
            git push origin "$branch_name"
            gh pr create --title "chore: update generated files" --body "Automated PR to update generated files" --base "${{ github.head_ref || github.ref_name }}" --head "$branch_name"
            echo "created_pr=true" >> $GITHUB_OUTPUT
          else
            echo "created_pr=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI
        run: mise run ci

      - name: Build Go binary
        run: mise exec go@1.23.0 -- go build -o wsvpn-linux-amd64 .

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_name="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag_name="v0.0.0-dispatch-$(date +%s)"
          fi
          gh release create "$tag_name" wsvpn-linux-amd64 --title "Release $tag_name" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: wsvpn-linux-amd64
          path: wsvpn-linux-amd64
