name: Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  mise-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: mise run codegen
      - name: Check for differences
        id: check_diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "diff=true" >> $GITHUB_OUTPUT
          fi
      - name: Create PR if differences
        if: steps.check_diff.outputs.diff == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update generated code"
          title: "chore: update generated code"
          body: "This PR updates the generated code."
          branch: "chore/update-generated-code"
      - run: mise run ci
      - name: Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes
      - name: Build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: go build -o wsvpn ./cmd/server/main.go
      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: wsvpn-binary
          path: wsvpn
